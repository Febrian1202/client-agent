name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: client_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      APP_URL: http://localhost:3001
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/client_agent
      REDIS_URL: redis://localhost:6379
      AUTH_USERNAME: admin
      AUTH_PASSWORD_HASH: '$argon2id$v=19$m=65536,t=2,p=1$bPUR30fXb+3Q0vAt9gE3QU9RlwYL/aY56PWJ8jZFDeY$fYqUrG3GjIXSN8o7clybg1RajUlOFdadc0VEA/K1ctw'
      AUTH_SECRET: dev_secret_key_12345678901234567890123456789012
      BROWSER_PROFILE_PATH: ./browser-profile
      GOOGLE_CLIENT_ID: mock_client_id
      GOOGLE_CLIENT_SECRET: mock_client_secret
      GOOGLE_REDIRECT_URI: http://localhost:3001/api/v1/integrations/gmail/callback
      GOOGLE_PUBSUB_TOPIC: mock_topic
      GOOGLE_PUBSUB_AUDIENCE: mock_audience
      DISCORD_BOT_TOKEN: mock_discord_token
      DISCORD_APPLICATION_ID: mock_app_id
      DISCORD_GUILD_ID: mock_guild_id
      AI_BASE_URL: https://api.openai.com/v1
      AI_PROVIDER_API_KEY: mock_ai_key
      AI_MODEL: gpt-4o
      AI_TIMEOUT_MS: 60000
      AI_MAX_RETRIES: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Browsers & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Database Migrations
        run: bun run --filter=@client-agent/db db:migrate

      - name: Seed Database
        run: bun run --filter=@client-agent/db seed

      - name: Run Monorepo Test Suite
        run: bun test

      - name: Verify Web Dashboard Build
        run: bun run build
